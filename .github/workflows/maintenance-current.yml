name: Verify current maintenance and conversation startup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: messenger
    env:
      FOREDU_NATIVE_BIN_DIR: ${{ github.workspace }}/messenger/target/release
      FOREDU_LICENSE_AUTO: '0'
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          repository: hwanys2/foreducator-frontend
          ref: ead1c3d77a6cdea260070e191b495934b69fd50f
          ssh-key: ${{ secrets.FOREDU_MAINT025_SOURCE_READ_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 26.5.0
          cache: npm
          cache-dependency-path: messenger/package-lock.json
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            messenger/target
          key: messenger-windows-rust-1.99.1-${{ hashFiles('messenger/Cargo.lock') }}
          restore-keys: messenger-windows-rust-1.99.1-
      - name: Build actual Windows programs
        run: cargo build --release --workspace --locked
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: ${{ steps.rust-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            messenger/target
          key: messenger-windows-rust-1.99.1-${{ hashFiles('messenger/Cargo.lock') }}
      - name: Prepare renderer and runtime
        id: setup
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          node scripts/ensure-electron.mjs
          node scripts/ensure-builder-tools.mjs
          ./scripts/windows-runtime.ps1
          npm run build
          node node_modules/playwright/cli.js install chromium
      - name: Verify real current-server restoration
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/windows-server-restore.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: maintenance-current
          path: messenger/test-results/
          retention-days: 2
