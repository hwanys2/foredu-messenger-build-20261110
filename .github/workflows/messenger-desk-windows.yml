name: Messenger 0.2.1 exact installed-file verification
on:
  workflow_dispatch:
    inputs:
      verify_external_relay:
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
concurrency:
  group: messenger-021-exact-windows
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 55
    defaults:
      run:
        working-directory: messenger
        shell: pwsh
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          repository: hwanys2/foreducator-frontend
          ref: aecb548e9a13cd4165856fd3000126111745fad1
          ssh-key: ${{ secrets.FOREDU_ADMIN021_SOURCE_READ_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 26.5.0
      - name: Install pinned test dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FOREDU_MESSENGER_TEST_AUTH: ${{ secrets.FOREDU_ADMIN021_AUTH }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ([string]::IsNullOrWhiteSpace($env:FOREDU_MESSENGER_TEST_AUTH)) { throw 'Synthetic fixture login must be configured before starting verification.' }
          npm ci --no-audit --no-fund
          node scripts/ensure-electron.mjs
          node scripts/ensure-builder-tools.mjs
          node node_modules/playwright/cli.js install chromium
      - name: Retrieve the exact source build installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 43131695203 --repo hwanys2/foredu-messenger-build-20261110 --name messenger-windows-prototype --dir "$env:RUNNER_TEMP/foredu-frozen"
      - name: Verify exact immutable installers and matching native/core source
        env:
          EXPECTED_FILES: '{"release/ForeduMessenger-Administration-SchoolTest-0.2.1-x64.exe":"fd2e3edfa787c445d609940c039cb386780e23ffc9ed905b8c1abbbfa9b0f932","release/ForeduMessenger-SchoolTest-0.2.1-x64.exe":"2ce1ee16f46e30d1c523b9ba01b9163c1d74c89421fb9a3f019f28da542e8099","target/release/foredu-server.exe":"4ec0a52fd87d373b22adf9c47dcb2369625763b73767f60928704f529445c76e","target/release/vcruntime140.dll":"d5e4d9a3e835fa679450145d6a7d94e36573a509317111904d9b3712c30d9066","target/release/vccorlib140.dll":"19839407c3fdbc824e5bce189bf68ddf8097f12ec28b757797ffa0415c144ddd","target/release/concrt140.dll":"2405355f0a58067b258f8df33c327e3a3d716eaac5a3a5aebb757842d85bd376","target/release/msvcp140_atomic_wait.dll":"640b2aefced484d0368eea5bdd06addd0658a3a70a49256e560d6923b404a479","target/release/msvcp140_1.dll":"bfad5aef4c63a669e3c140655cdfdf395b6c979b400a447bd5dcb65ed8826c3d","target/release/foredu-native.exe":"cfd4ed58ef866f49f7c11b5649ccbb01e3786c2da3988091533aff64c580907a","target/release/msvcp140_2.dll":"3ea06f0ee098b4823cb79599df3780e7f23cce52c19aac31d2a0d47efe33a5e9","target/release/msvcp140_codecvt_ids.dll":"f2069a52880ec885ee7f0511186100eb7fada0411a2b4948fafea7735b878a18","target/release/vcruntime140_1.dll":"1f2d41c4aa5db0bc33ebf7b66d72943a817d7ce6cbe880502a9403823633093f","target/release/vcruntime140_threads.dll":"219915cf20822f34d5e7c1fdd4e21ae7f3396881096c51036225fb8f84b47afa","target/release/foredu-native-input.exe":"ac2b5bb194f118185f1c8420af6fed87a45236c35f448f1077546f994e7ed992","target/release/msvcp140.dll":"0f885b509a685d2bbfa652fed26b5fb31d88fbdab0a978c641d1c7b8aa460aa9"}'
        run: |
          @'
          import fs from 'node:fs/promises';import{createReadStream}from'node:fs';import path from 'node:path';import crypto from 'node:crypto';import assert from 'node:assert/strict';import{sourceEvidence}from'./scripts/release-evidence.mjs';assert.deepEqual(sourceEvidence(),{sourceCommit:'aecb548e9a13cd4165856fd3000126111745fad1',sourceDirty:false});const base=path.join(process.env.RUNNER_TEMP,'foredu-frozen'),expected=JSON.parse(process.env.EXPECTED_FILES);for(const[file,hash]of Object.entries(expected)){const h=crypto.createHash('sha256');for await(const b of createReadStream(path.join(base,file)))h.update(b);assert.equal(h.digest('hex'),hash,file);}for(const folder of ['release','target/release','test-results'])await fs.cp(path.join(base,folder),folder,{recursive:true});for(const name of ['installed-verification','external-installed','desk-linked-desktop'])await fs.rm('test-results/'+name+'.json',{force:true});for(const name of ['native-notices-core','desk-core','school-bells-core','live-core','windows-server-reinstall']){const r=JSON.parse(await fs.readFile('test-results/'+name+'.json','utf8'));assert.equal(r.sourceCommit,'aecb548e9a13cd4165856fd3000126111745fad1',name);assert.equal(r.sourceDirty,false,name);assert.equal(r.platform,'win32',name);}await fs.writeFile('test-results/frozen-installer-inputs.json',JSON.stringify({ok:true,...sourceEvidence(),platform:process.platform,sourceBuildRun:'https://github.com/hwanys2/foredu-messenger-build-20261110/actions/runs/43131695203',currentRunId:process.env.GITHUB_RUN_ID,files:expected,buildAndCoreChecks:'previous actual Windows source build; unchanged exact installer/native bytes',installedVerification:'fresh Windows 2022 full installed-app suite follows'},null,2));
          '@ | node --input-type=module
      - name: Prepare private higher-version update fixtures without rebuilding public candidates
        env:
          FOREDU_NATIVE_BIN_DIR: ${{ github.workspace }}/messenger/target/release
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm run build
          node scripts/build-update-fixtures.mjs
      - name: Verify installed apps and actual production connection
        env:
          FOREDU_NATIVE_BIN_DIR: ${{ github.workspace }}/messenger/target/release
          FOREDU_MESSENGER_TEST_AUTH: ${{ secrets.FOREDU_ADMIN021_AUTH }}
          FOREDU_TEST_PRODUCTION_RELAY: '1'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ([string]::IsNullOrWhiteSpace($env:FOREDU_MESSENGER_TEST_AUTH)) { throw 'Dedicated synthetic login is required before running the installed suite.' }
          node scripts/verify-install.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: messenger-windows-prototype
          path: |
            messenger/release/*.exe
            messenger/target/release/foredu-server.exe
            messenger/target/release/foredu-native.exe
            messenger/target/release/foredu-native-input.exe
            messenger/target/release/*.dll
            messenger/test-results/
          retention-days: 2
