name: Diagnose private workspace update persistence
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          repository: hwanys2/foreducator-frontend
          ref: 888da3af095de6eeb41377db32dd3de6f294a6ff
          ssh-key: ${{ secrets.FOREDU_DESK020_SOURCE_READ_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 26.5.0
      - working-directory: messenger
        run: npm ci --no-audit --no-fund
      - name: Retrieve existing diagnostic installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 43027236168 --repo hwanys2/foredu-messenger-build-20261110 --name messenger-windows-prototype --dir "$env:RUNNER_TEMP/old-installers"
      - name: Instrument only diagnostic test and run exact existing installers
        working-directory: messenger
        shell: pwsh
        run: |
          @'
          import fs from 'node:fs/promises';import path from 'node:path';import {fileHash} from './scripts/release-evidence.mjs';import {runInstaller} from './scripts/update-fixture-support.mjs';import {spawn} from 'node:child_process';
          const artifacts=path.join(process.env.RUNNER_TEMP,'old-installers');await fs.cp(path.join(artifacts,'test-results/update-fixtures.json'),'test-results/update-fixtures.json');await fs.cp(path.join(artifacts,'release/update-fixtures'),'release/update-fixtures',{recursive:true});
          const script='scripts/update-cross-version-desktop.mjs';let s=await fs.readFile(script,'utf8');const old="    assert.equal(\n      await opened.page.getByLabel(\"\uc774 PC\uc758 \uac1c\uc778 \uba54\ubaa8\").inputValue(),\n      workspaceMemo,\n    );";
          if(!s.includes(old))throw Error('Diagnostic anchor changed');s=s.replace(old,`    for(let attempt=0;attempt<6;attempt++){const state=await opened.page.evaluate(()=>window.messenger.liveRequest('desk-state'));const ui=await opened.page.getByLabel('이 PC의 개인 메모').inputValue();console.log('MEMO_DIAGNOSTIC',JSON.stringify({attempt,nativeMatches:state.memo===workspaceMemo,uiMatches:ui===workspaceMemo,nativeLength:state.memo.length,uiLength:ui.length}));await opened.page.waitForTimeout(1000);} const state=await opened.page.evaluate(()=>window.messenger.liveRequest('desk-state'));assert.equal(state.memo,workspaceMemo,'Protected journal must preserve the memo');`+old);await fs.writeFile(script,s);
          const installer=path.join(artifacts,'release/ForeduMessenger-SchoolTest-0.2.0-x64.exe');const destination=path.join(process.env.RUNNER_TEMP,'memo-update-installed');await runInstaller(installer,destination);const child=spawn(process.execPath,[script],{stdio:'inherit',env:{...process.env,FOREDU_UPDATE_EXECUTABLE:path.join(destination,'ForeduSchoolMessengerTrial.exe'),FOREDU_UPDATE_INSTALLER:installer,FOREDU_INSTALLER_SHA256:await fileHash(installer),FOREDU_SKIP_UPDATE:'1',FOREDU_LICENSE_AUTO:'0'}});await new Promise((resolve,reject)=>{child.once('error',reject);child.once('exit',c=>c===0?resolve():reject(Error('Diagnostic code '+c)));});
          '@ | node --input-type=module
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: workspace-memo-diagnostic-do-not-publish
          path: messenger/test-results/
          retention-days: 2
