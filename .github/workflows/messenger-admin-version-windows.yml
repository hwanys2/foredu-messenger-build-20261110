name: Diagnose existing administration installer
on:
  workflow_dispatch:
    inputs:
      verify_external_relay:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        working-directory: messenger
        shell: pwsh
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          repository: hwanys2/foreducator-frontend
          ref: 40a27c346bf37c2cdbae764978926fb2d1efafe0
          ssh-key: ${{ secrets.FOREDU_ADMIN022_SOURCE_READ_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 26.5.0
          cache: npm
          cache-dependency-path: messenger/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: messenger-windows-prototype
          path: messenger
          github-token: ${{ github.token }}
          run-id: 43170414606
      - name: Diagnose the unchanged actual installer failure
        env:
          FOREDU_NATIVE_BIN_DIR: ${{ github.workspace }}/messenger/target/release
          FOREDU_UPDATE_INSTALLER: ${{ github.workspace }}/messenger/release/ForeduMessenger-Administration-SchoolTest-0.2.2-x64.exe
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          @'
          // Diagnostic run only. Never a release report or a substitute for the gate.
          import fs from 'node:fs';
          import fsp from 'node:fs/promises';
          import path from 'node:path';
          import os from 'node:os';
          import { spawn } from 'node:child_process';
          import { createRequire } from 'node:module';
          const require = createRequire(import.meta.url);
          const { powershell } = require(path.resolve('electron/server-install.cjs'));
          await fsp.mkdir('test-results', { recursive: true });
          const watchRoot = await fsp.mkdtemp(path.join(os.tmpdir(), 'foredu-installer-diagnosis-'));
          const records = [];
          const seen = new Set();
          const watcher = fs.watch(watchRoot, { recursive: true }, (_event, file) => {
            if (!file || !file.endsWith('foredu-server-update-result.json')) return;
            try {
              const value = JSON.parse(fs.readFileSync(path.join(watchRoot, file), 'utf8'));
              const safe = Object.fromEntries(['ok','stage','type','resultCode','rollbackOk','version'].map(k => [k,value[k]]));
              if (seen.has(JSON.stringify(safe))) return;
              seen.add(JSON.stringify(safe)); records.push(safe);
              fs.writeFileSync('test-results/nsis-server-update-diagnostic.json', JSON.stringify({diagnosticOnly:true,records},null,2));
              console.log('Installer helper status:', JSON.stringify(safe));
            } catch {}
          });
          const test = 'scripts/windows-server-reinstall.mjs';
          const original = await fsp.readFile(test, 'utf8');
          const marker = '} finally {\n  if (app) await app.close()';
          if (!original.includes(marker)) throw Error('Expected diagnostic insertion point.');
          const diagnostic = `} catch (originalError) {
            console.log('Diagnostic only: installer failure was retained.');
            const info = await powershell("$s=Get-CimInstance Win32_Service -Filter \\\"Name='ForeduSchoolMessenger'\\\"; @{serviceState=$s.State;servicePath=$s.PathName;diagnosticProcess64=[Environment]::Is64BitProcess;programFiles=[Environment]::GetFolderPath('ProgramFiles')}|ConvertTo-Json -Compress").catch(()=> '{}');
            console.log('Service metadata:', info);
            const binary = path.join(destination,'resources/native/foredu-server.exe');
            console.log('Installed native file exists:', await fs.access(binary).then(()=>true,()=>false));
            if (await fs.access(binary).then(()=>true,()=>false)) {
              const result = path.resolve('test-results/direct-installer-diagnostic.json');
              const hash = await fileHash(binary);
              const quote = value => "'"+value.replace(/'/g,"''")+"'";
              try {
                await powershell('& '+quote(path.resolve('electron/windows-server-update.ps1'))+' -ServerExecutable '+quote(binary)+" -ExpectedHash '"+hash+"' -ExpectedVersion '"+current+"' -Diagnostic "+quote(result)+';exit $LASTEXITCODE','',180000);
                console.log('Direct source updater succeeded on the same retained service.');
              } catch { console.log('Direct source updater also failed.'); }
              console.log('Direct updater status:', await fs.readFile(result,'utf8').catch(()=> 'missing'));
            }
            throw originalError;
          `;
          await fsp.writeFile(test, original.replace(marker, diagnostic + marker));
          try {
            const code = await new Promise((resolve,reject) => {
              const child = spawn(process.execPath,[test], {stdio:'inherit',env:{...process.env,TEMP:watchRoot,TMP:watchRoot,FOREDU_SERVICE_UPGRADE_CASE:'0.1.5'}});
              child.once('error',reject); child.once('exit',resolve);
            });
            console.log('Diagnostic retained installer exit:', code);
            if (!records.length) console.log('No inner helper diagnostic was observed.');
            // A failing installer remains a failure, even if a direct helper succeeded.
            process.exitCode = Number(code) || 1;
          } finally {
            watcher.close();
            await fsp.writeFile(test, original);
            await fsp.rm(watchRoot,{recursive:true,force:true});
          }
          '@ | Set-Content -Encoding utf8 diagnostic-installer.mjs
          node diagnostic-installer.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installer-diagnostic-only
          path: messenger/test-results/*diagnostic*.json
          retention-days: 2
