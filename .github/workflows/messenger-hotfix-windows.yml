name: Continue exact verified Windows installers
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 65
    defaults:
      run:
        shell: pwsh
        working-directory: messenger
    env:
      FOREDU_NATIVE_BIN_DIR: ${{ github.workspace }}/messenger/target/release
      FOREDU_DISTRIBUTION_SOURCE: feb62515b64c113c33f7576a72831baf662b7a89
      FOREDU_LICENSE_AUTO: '0'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          repository: hwanys2/foreducator-frontend
          ref: 201c1418d78f924bead1a63a5834622e3c81ca29
          ssh-key: ${{ secrets.FOREDU_HOTFIX025_SOURCE_READ_KEY }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 26.5.0
          cache: npm
          cache-dependency-path: messenger/package-lock.json
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: messenger-windows-prototype
          path: ${{ runner.temp }}/retained-candidate
          github-token: ${{ github.token }}
          run-id: 43395261996
      - name: Verify unchanged application inputs and authentic retained binaries
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RETAINED_SOURCE_RUN: '43395261996'
          RETAINED_ARTIFACT_ID: '14025075579'
          RETAINED_ARTIFACT_DIGEST: 'sha256:7578e444139d1c9c382fcc07ad71dc176d87e4942d8862582b89982c898dd8ea'
          RETAINED_EXPECTED_HASHES: '{"release/ForeduMessenger-SchoolTest-0.2.5-x64.exe":"3d9103898ef2f8753a12a66f90ba162f4a4ca232235067665b2c222ede34935d","release/ForeduMessenger-Administration-SchoolTest-0.2.5-x64.exe":"4fd6b69a6d97412cd1c085e776210a271a904cb428fe8c3ed0f7461c0f84d17b","target/release/foredu-server.exe":"a4788a86aeadb3be561ff7346ed9cbc75991852ed718acc60f491ef1c84d8763","target/release/foredu-native.exe":"6d8065084f649258c02d8b96ab857acb70e822a4ccd7febf70e6caccca0e6c1d","target/release/foredu-native-input.exe":"0412d314aac6bc99fea44266c6934358308faf9b211cd3089fe5a70d90488049","target/release/vcruntime140.dll":"d1f4225df2cd877dbf130d5668a021dce3f94118455ff5ec952061c30afc9ce7","target/release/vccorlib140.dll":"09f93d5ff96ae09767f3e1af3cdd43a5a58f2598654fc63089429bb6f9f4737f","target/release/concrt140.dll":"54716f0738af891f283d213b5c8d11b25896bb8ee3097d301eae718560cf974e","target/release/msvcp140_atomic_wait.dll":"3d0cbfaa1bf3eecf5a3f4491d2960ee803cb994f30292c6adc4a07c498f60e2b","target/release/msvcp140_1.dll":"206c931bf90fdad8816de3b5e2ef80b2bcaa9406c89ecc05fe6fddffe251e982","target/release/msvcp140_2.dll":"d50d7883f20d1dc6191768d3746f52dd9cac89c346ffaed5be1f110c2f34a838","target/release/msvcp140_codecvt_ids.dll":"8a65c7596ef2e6938731f5a1058e7e40145b6d97967cc649231a076b9a608d78","target/release/vcruntime140_1.dll":"a7146c08f89fe5b04541ab507cdb59ff7b44534d4ba3c668a426c6450a03434e","target/release/vcruntime140_threads.dll":"40f39e8cee5f5a531b4010e18b807e8fe265b908dc58f959ecb7ebc6ea6cb11a","target/release/msvcp140.dll":"7c26614e1d733892c2deac7e245ce115504b1d80592dd0a01b08e3e5a55f89ca"}'
          RETAINED_ARTIFACT_DIR: ${{ runner.temp }}/retained-candidate
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $proof=Join-Path $env:RUNNER_TEMP 'verify-retained-candidate.mjs'
          [IO.File]::WriteAllBytes($proof,[Convert]::FromBase64String(''))
          node $proof
      - name: Prepare renderer and private future update fixtures
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          node scripts/ensure-electron.mjs
          node scripts/ensure-builder-tools.mjs
          npm run build
          node node_modules/playwright/cli.js install chromium
          node scripts/build-update-fixtures.mjs
      - name: Verify client and Electron windows
        env:
          FOREDU_NATIVE_BIN_DIR: ${{ github.workspace }}/messenger/target/release
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm test
          node scripts/third-party-notices.mjs --check
          node scripts/native-notices.mjs --check
          node scripts/native-notices-core.mjs
          node scripts/desk-core.mjs
          node scripts/server-resume-core.mjs
          node scripts/school-bells-core.mjs
          node scripts/large-store-core.mjs
          npm run build
          node node_modules/playwright/cli.js install chromium
          npm run test:desktop
          node scripts/multigroup-core.mjs
          node scripts/administration-desktop.mjs
          node scripts/windows-legacy-upgrade.mjs
          node scripts/windows-update-launcher.mjs
          node scripts/group-read-core.mjs
          node scripts/conversation-retry-core.mjs
          node scripts/remote-core.mjs
          npm run test:live
          node ../scripts/messenger/relay-wire-contract.mjs
          node scripts/lifecycle-core.mjs
          node scripts/group-lifecycle.mjs
          node scripts/group-departure.mjs
          node scripts/group-members-core.mjs
          node scripts/rekey-publication.mjs
          node scripts/review-core.mjs
          node scripts/file-queue-core.mjs
          node scripts/folder-core.mjs
          node scripts/folder-desktop.mjs
          node scripts/compose-drafts-core.mjs
          node scripts/compose-drafts-desktop.mjs
          node scripts/conversation-window-desktop.mjs
          node scripts/conversation-list-desktop.mjs
          node scripts/conversation-read-desktop.mjs
          node scripts/personal-collections-core.mjs
          node scripts/personal-collections-desktop.mjs
          node scripts/library-settings-desktop.mjs
          node scripts/library-reference-core.mjs
          node scripts/library-reference-desktop.mjs
          node scripts/screen-lock-core.mjs
          node scripts/screen-lock-desktop.mjs
          node scripts/scheduled-desktop.mjs
          node scripts/rich-text-core.mjs
          node scripts/rich-text-desktop.mjs
          node scripts/media-queue-desktop.mjs
          node scripts/library-cleanup-core.mjs
          node scripts/timetable-notices-core.mjs
          node scripts/history-core.mjs
          node scripts/recall-core.mjs
          node scripts/recall-desktop.mjs
          node scripts/school-work-core.mjs
          node scripts/notes-core.mjs
          node scripts/self-recovery.mjs
          node scripts/recovery-history.mjs
          node scripts/capture-attachment-desktop.mjs
          node scripts/lifecycle-desktop.mjs
          node scripts/windows-input.mjs
          npm audit --audit-level=moderate
      - name: Verify installed application
        env:
          FOREDU_NATIVE_BIN_DIR: ${{ github.workspace }}/messenger/target/release
          FOREDU_MESSENGER_TEST_AUTH: ${{ secrets.FOREDU_HOTFIX025_AUTH }}
          FOREDU_TEST_PRODUCTION_RELAY: 1
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          node node_modules/playwright/cli.js install chromium
          node scripts/verify-install.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: messenger-windows-prototype
          path: |
            messenger/release/*.exe
            messenger/target/release/foredu-server.exe
            messenger/target/release/foredu-native.exe
            messenger/target/release/foredu-native-input.exe
            messenger/target/release/*.dll
            messenger/test-results/
          retention-days: 2
