name: School server version 0.2.4 installed verification
on:
  workflow_dispatch:
    inputs:
      native_source_run:
        description: Completed Windows native run with identical Rust inputs (optional)
        required: false
        type: string
      verify_external_relay:
        description: Verify installed apps against the deployed relay with synthetic accounts
        required: false
        default: false
        type: boolean
concurrency:
  group: messenger-windows-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        working-directory: messenger
        shell: pwsh
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: hwanys2/foreducator-frontend
          ref: 4862fad221ff0d9f803faff33be7c57770b5694f
          ssh-key: ${{ secrets.FOREDU_HOTFIX024_SOURCE_READ_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 26.5.0
          cache: npm
          cache-dependency-path: messenger/package-lock.json
      - name: Verify Windows updater syntax
        run: node scripts/windows-updater-syntax.mjs
      - name: Install pinned Rust toolchain
        if: ${{ !inputs.native_source_run }}
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: ${{ !inputs.native_source_run }}
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            messenger/target
          key: messenger-windows-rust-1.99.1-${{ hashFiles('messenger/Cargo.lock') }}
          restore-keys: messenger-windows-rust-1.99.1-
      - name: Install dependencies
        run: npm ci
      - name: Ensure Electron binary is available
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/ensure-electron.mjs
          node scripts/ensure-builder-tools.mjs
      - name: Build native executables
        if: ${{ !inputs.native_source_run }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build --release --workspace --locked
          ./target/release/foredu-native-input.exe --probe
      - name: Save native dependencies before desktop verification
        if: ${{ !inputs.native_source_run && steps.rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            messenger/target
          key: messenger-windows-rust-1.99.1-${{ hashFiles('messenger/Cargo.lock') }}
      - name: Verify existing native build provenance
        if: ${{ inputs.native_source_run }}
        env:
          NATIVE_SOURCE_RUN: ${{ inputs.native_source_run }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-native-artifact.mjs
      - name: Retrieve verified native artifact
        if: ${{ inputs.native_source_run }}
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: messenger-windows-prototype
          path: messenger/imported-native
          github-token: ${{ github.token }}
          run-id: ${{ inputs.native_source_run }}
      - name: Prepare existing native executables
        if: ${{ inputs.native_source_run }}
        run: |
          New-Item -ItemType Directory -Force target/release | Out-Null
          foreach ($name in @('foredu-server.exe','foredu-native.exe','foredu-native-input.exe')) {
            $files = @(Get-ChildItem imported-native -Filter $name -File -Recurse)
            if ($files.Length -ne 1) { throw "A unique verified native executable is required." }
            Copy-Item -LiteralPath $files[0].FullName -Destination (Join-Path target/release $name)
          }
      - name: Prepare app-local Windows runtime
        run: ./scripts/windows-runtime.ps1
      - name: Verify actual screen capture and window restoration
        env:
          FOREDU_NATIVE_BIN_DIR: ${{ github.workspace }}/messenger/target/release
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm run build
          node node_modules/playwright/cli.js install chromium
          $env:FOREDU_CAPTURE_PRODUCT_VIDEO = '1'
          node scripts/remote-desktop.mjs
          Remove-Item Env:FOREDU_CAPTURE_PRODUCT_VIDEO
      - name: Verify widget login and account isolation
        env:
          FOREDU_NATIVE_BIN_DIR: ${{ github.workspace }}/messenger/target/release
        run: node scripts/account-switch-desktop.mjs
      - name: Verify backup and restoration desktop workflow
        env:
          FOREDU_NATIVE_BIN_DIR: ${{ github.workspace }}/messenger/target/release
        run: node scripts/backup-desktop.mjs
      - name: Verify Rust formatting
        if: ${{ !inputs.native_source_run }}
        run: cargo fmt --all --check
      - name: Check native core
        if: ${{ !inputs.native_source_run }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test native core
        if: ${{ !inputs.native_source_run }}
        run: cargo test --workspace --locked
      - name: Verify actual outside photo before packaging
        env:
          FOREDU_NATIVE_BIN_DIR: ${{ github.workspace }}/messenger/target/release
          FOREDU_MESSENGER_TEST_AUTH: ${{ secrets.FOREDU_HOTFIX024_AUTH }}
          FOREDU_EXTERNAL_SOURCE_ONLY: '1'
          FOREDU_EXTERNAL_TRACE: '1'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm run build
          $env:ELECTRON_EXECUTABLE = node -p "require('electron')"
          node scripts/external-production.mjs
      - name: Verify collapsible multi-department directory
        env:
          FOREDU_NATIVE_BIN_DIR: ${{ github.workspace }}/messenger/target/release
        run: node scripts/multigroup-desktop.mjs
      - name: Verify shared and personal calendars
        env:
          FOREDU_NATIVE_BIN_DIR: ${{ github.workspace }}/messenger/target/release
        run: node scripts/calendar-privacy-browser.mjs
      - name: Verify Windows pinned app identity
        env:
          FOREDU_NATIVE_BIN_DIR: ${{ github.workspace }}/messenger/target/release
        run: node scripts/windows-identity.mjs
      - name: Verify timetable force approval and conversation layout
        env:
          FOREDU_NATIVE_BIN_DIR: ${{ github.workspace }}/messenger/target/release
        run: node scripts/usability-browser.mjs
      - name: Verify stop-denied school service recovery
        env:
          FOREDU_NATIVE_BIN_DIR: ${{ github.workspace }}/messenger/target/release
        run: node scripts/windows-service.mjs
      - name: Verify first login and offline group messaging
        env:
          FOREDU_NATIVE_BIN_DIR: ${{ github.workspace }}/messenger/target/release
        run: node scripts/first-login-core.mjs
      - name: Verify existing attachment read state during upgrade
        env:
          FOREDU_NATIVE_BIN_DIR: ${{ github.workspace }}/messenger/target/release
        run: node scripts/attachment-read-migration.mjs
      - name: Verify scheduled attachment read status
        env:
          FOREDU_NATIVE_BIN_DIR: ${{ github.workspace }}/messenger/target/release
        run: node scripts/scheduled-core.mjs
      - name: Verify bundled fonts and conversation controls
        env:
          FOREDU_NATIVE_BIN_DIR: ${{ github.workspace }}/messenger/target/release
        run: node scripts/conversation-tools-desktop.mjs
      - name: Verify saved message removal
        env:
          FOREDU_NATIVE_BIN_DIR: ${{ github.workspace }}/messenger/target/release
        run: node scripts/history-desktop.mjs
      - name: Verify the school calendar
        env:
          FOREDU_NATIVE_BIN_DIR: ${{ github.workspace }}/messenger/target/release
        run: node scripts/school-work-desktop.mjs
      - name: Verify live desktop conversation widgets
        env:
          FOREDU_NATIVE_BIN_DIR: ${{ github.workspace }}/messenger/target/release
        run: node scripts/live-desktop.mjs
      - name: Verify installer host environment isolation
        env:
          FOREDU_NATIVE_BIN_DIR: ${{ github.workspace }}/messenger/target/release
        run: node scripts/windows-installer-wrapper.mjs
      - name: Verify encrypted backup restoration
        env:
          FOREDU_NATIVE_BIN_DIR: ${{ github.workspace }}/messenger/target/release
        run: node scripts/backup-core.mjs
      - name: Build separate teacher and administration installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          FOREDU_NATIVE_BIN_DIR: ${{ github.workspace }}/messenger/target/release
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm run package:win -- --publish never
          npm run package:win:admin -- --publish never
          node scripts/build-update-fixtures.mjs
      - name: Verify initial exact installed production connection
        env:
          FOREDU_NATIVE_BIN_DIR: ${{ github.workspace }}/messenger/target/release
          FOREDU_MESSENGER_TEST_AUTH: ${{ secrets.FOREDU_HOTFIX024_AUTH }}
          FOREDU_LICENSE_AUTO: '0'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          node node_modules/playwright/cli.js install chromium
          @'
          import{spawn}from'node:child_process';import path from'node:path';import fs from'node:fs/promises';import{fileHash}from'./scripts/release-evidence.mjs';const dest=path.join(process.env.RUNNER_TEMP,'ForeduSchoolInstalledVerification','teacher'),installer=path.resolve('release/ForeduMessenger-SchoolTest-0.2.4-x64.exe'),exe=path.join(dest,'ForeduSchoolMessengerTrial.exe');const run=(cmd,args,env=process.env)=>new Promise((ok,no)=>{const p=spawn(cmd,args,{env,stdio:'inherit'});p.once('error',no);p.once('exit',c=>c===0?ok():no(Error('Installed production preflight failed '+c)));});await run(installer,['/S','/D='+dest]);const env={...process.env,ELECTRON_EXECUTABLE:exe,FOREDU_INSTALLER_SHA256:await fileHash(installer)};await run(process.execPath,['scripts/external-production.mjs'],env);await fs.copyFile('test-results/external-installed.json','test-results/external-preflight.json');await run(process.execPath,['scripts/desk-linked-desktop.mjs'],env);await fs.copyFile('test-results/desk-linked-desktop.json','test-results/desk-linked-preflight.json');
          '@ | node --input-type=module
      - name: Verify installer upgrades existing school services before login
        env:
          FOREDU_NATIVE_BIN_DIR: ${{ github.workspace }}/messenger/target/release
          FOREDU_UPDATE_INSTALLER: ${{ github.workspace }}/messenger/release/ForeduMessenger-Administration-SchoolTest-0.2.4-x64.exe
        run: node scripts/windows-server-reinstall.mjs
      - name: Verify client and Electron windows
        env:
          FOREDU_NATIVE_BIN_DIR: ${{ github.workspace }}/messenger/target/release
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm test
          node scripts/third-party-notices.mjs --check
          node scripts/native-notices.mjs --check
          node scripts/native-notices-core.mjs
          node scripts/desk-core.mjs
          node scripts/server-resume-core.mjs
          node scripts/school-bells-core.mjs
          node scripts/large-store-core.mjs
          npm run build
          node node_modules/playwright/cli.js install chromium
          npm run test:desktop
          node scripts/multigroup-core.mjs
          node scripts/administration-desktop.mjs
          node scripts/windows-legacy-upgrade.mjs
          node scripts/windows-update-launcher.mjs
          node scripts/group-read-core.mjs
          node scripts/conversation-retry-core.mjs
          node scripts/remote-core.mjs
          npm run test:live
          node ../scripts/messenger/relay-wire-contract.mjs
          node scripts/lifecycle-core.mjs
          node scripts/group-lifecycle.mjs
          node scripts/group-departure.mjs
          node scripts/group-members-core.mjs
          node scripts/rekey-publication.mjs
          node scripts/review-core.mjs
          node scripts/file-queue-core.mjs
          node scripts/folder-core.mjs
          node scripts/folder-desktop.mjs
          node scripts/compose-drafts-core.mjs
          node scripts/compose-drafts-desktop.mjs
          node scripts/conversation-window-desktop.mjs
          node scripts/conversation-list-desktop.mjs
          node scripts/conversation-read-desktop.mjs
          node scripts/personal-collections-core.mjs
          node scripts/personal-collections-desktop.mjs
          node scripts/library-settings-desktop.mjs
          node scripts/library-reference-core.mjs
          node scripts/library-reference-desktop.mjs
          node scripts/screen-lock-core.mjs
          node scripts/screen-lock-desktop.mjs
          node scripts/scheduled-desktop.mjs
          node scripts/rich-text-core.mjs
          node scripts/rich-text-desktop.mjs
          node scripts/media-queue-desktop.mjs
          node scripts/library-cleanup-core.mjs
          node scripts/timetable-notices-core.mjs
          node scripts/history-core.mjs
          node scripts/recall-core.mjs
          node scripts/recall-desktop.mjs
          node scripts/school-work-core.mjs
          node scripts/notes-core.mjs
          node scripts/self-recovery.mjs
          node scripts/recovery-history.mjs
          node scripts/capture-attachment-desktop.mjs
          node scripts/lifecycle-desktop.mjs
          node scripts/windows-input.mjs
          npm audit --audit-level=moderate
      - name: Verify installed application
        env:
          FOREDU_NATIVE_BIN_DIR: ${{ github.workspace }}/messenger/target/release
          FOREDU_MESSENGER_TEST_AUTH: ${{ secrets.FOREDU_HOTFIX024_AUTH }}
          FOREDU_TEST_PRODUCTION_RELAY: ${{ (github.event_name == 'push' || inputs.verify_external_relay) && '1' || '' }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          node node_modules/playwright/cli.js install chromium
          node scripts/verify-install.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: messenger-windows-prototype
          path: |
            messenger/release/*.exe
            messenger/target/release/foredu-server.exe
            messenger/target/release/foredu-native.exe
            messenger/target/release/foredu-native-input.exe
            messenger/target/release/*.dll
            messenger/test-results/
          retention-days: 2
