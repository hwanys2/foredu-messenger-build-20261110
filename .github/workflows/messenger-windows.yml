name: Diagnose exact old Windows app update
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 12
    defaults:
      run:
        working-directory: messenger
        shell: pwsh
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          repository: hwanys2/foreducator-frontend
          ref: 30ff4a726971b37d29aabe7d55d7b2a05df4eb0d
          ssh-key: ${{ secrets.FOREDU_SOURCE_READ_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 26.5.0
          cache: npm
          cache-dependency-path: messenger/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: messenger-windows-prototype
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
          run-id: 42949719166
      - name: Observe updater startup handshake before exit
        env:
          FOREDU_NATIVE_BIN_DIR: ${{ runner.temp }}/candidate/target/release
          FOREDU_LICENSE_AUTO: "0"
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs/promises';import path from 'node:path';import crypto from 'node:crypto';import assert from 'node:assert/strict';import {spawn,execFile} from 'node:child_process';import {promisify} from 'node:util';
          const exec=promisify(execFile),base=path.join(process.env.RUNNER_TEMP,'candidate'),role='teacher',installer=path.join(base,'release/ForeduMessenger-SchoolTest-0.1.8-x64.exe'),sha='ec117b555dc8b488fd861ea4c01ed1680254f6e284bec61668f10e11d6eb6b40';
          assert.equal(crypto.createHash('sha256').update(await fs.readFile(installer)).digest('hex'),sha);const source=JSON.parse(await fs.readFile(path.join(base,'test-results/live-desktop.json'),'utf8'));assert.equal(source.sourceCommit,'30ff4a726971b37d29aabe7d55d7b2a05df4eb0d');assert.equal(source.sourceDirty,false);assert.equal(source.installerSha256,sha);
          const destination=path.join(process.env.RUNNER_TEMP,'ExactUpdateDiagnostic');const run=(exe,args,env=process.env)=>new Promise((resolve,reject)=>{const p=spawn(exe,args,{env,stdio:'inherit'});p.on('error',reject);p.on('exit',code=>code===0?resolve():reject(Error('child exit '+code)));});
          await run(installer,['/S','/D='+destination]);
          const executable=path.join(destination,'ForeduSchoolMessengerTrial.exe');
          const {_electron}=await import('playwright');const originalLaunch=_electron.launch.bind(_electron);_electron.launch=async(options)=>{const app=await originalLaunch(options);const page=await app.firstWindow();await page.waitForFunction(()=>!!window.messenger?.liveRequest);await app.evaluate(({app})=>{const cp=process.getBuiltinModule('child_process'),fs=process.getBuiltinModule('fs'),path=process.getBuiltinModule('path'),log=path.join(app.getPath('userData'),'update-helper-diagnostic.log'),original=cp.ChildProcess.prototype.spawn;let helperStarted=false,ready=false,holding=false;app.on('before-quit',event=>{if(!helperStarted||ready)return;event.preventDefault();if(holding)return;holding=true;(async()=>{const end=Date.now()+15000;while(Date.now()<end){try{const r=JSON.parse(fs.readFileSync(path.join(app.getPath('userData'),'updates/result.json'),'utf8'));if(r.state){fs.appendFileSync(log,'startup handshake '+r.state+'\n');break;}}catch{}await new Promise(r=>setTimeout(r,100));}ready=true;app.quit();})();});cp.ChildProcess.prototype.spawn=function(options){const matched=/powershell/i.test(options.file||'')&&(options.args||[]).some(a=>/apply[.]ps1$/i.test(a));if(matched){helperStarted=true;fs.appendFileSync(log,JSON.stringify({file:options.file,args:options.args,detached:options.detached,envConfig:(options.envPairs||[]).find(x=>x.startsWith('FOREDU_UPDATE_CONFIG='))})+'\n');const fd=fs.openSync(log,'a');options.stdio=['ignore',fd,fd];}const result=original.call(this,options);if(matched){this.once('exit',(code,signal)=>fs.appendFileSync(log,JSON.stringify({exit:code,signal})+'\n'));this.once('error',e=>fs.appendFileSync(log,e.message+'\n'));}return result;};});return app;};Object.assign(process.env,{FOREDU_UPDATE_EXECUTABLE:executable,FOREDU_UPDATE_INSTALLER:installer,FOREDU_INSTALLER_SHA256:sha});let failed=false;try{await import('./scripts/update-cross-version-desktop.mjs');}catch(e){failed=true;console.log('Diagnostic test failed:',e.message);}try{console.log('Helper diagnostic output:',await fs.readFile(path.join(process.env.APPDATA,'ForeduSchoolMessengerTrial','update-helper-diagnostic.log'),'utf8'));}catch(e){console.log('Helper diagnostic absent:',e.code);} 
          const updates=path.join(process.env.APPDATA,'ForeduSchoolMessengerTrial','updates');let names=[];try{names=await fs.readdir(updates)}catch{};console.log('Owned update files:',JSON.stringify(names));
          let config;try{config=JSON.parse(await fs.readFile(path.join(updates,'apply.json'),'utf8'));console.log('Update config:',JSON.stringify({version:config.version,appPid:config.appPid,executable:config.executable,installer:config.installer,resultPath:config.resultPath}));}catch(e){console.log('Update config missing:',e.code||e.message)}
          try{const b=await fs.readFile(path.join(updates,'apply.ps1'));console.log('Helper bytes/BOM:',b.length,b.subarray(0,3).toString('hex'));}catch(e){console.log('Helper missing:',e.code)}
          try{console.log('Result:',await fs.readFile(path.join(updates,'result.json'),'utf8'));}catch(e){console.log('Result missing:',e.code)}
          const ps=path.join(process.env.SystemRoot,'System32/WindowsPowerShell/v1.0/powershell.exe');const commands=[`$t=$null;$e=$null;[System.Management.Automation.Language.Parser]::ParseFile($env:FOREDU_DIAG_HELPER,[ref]$t,[ref]$e)|Out-Null;$e|ForEach-Object{$_.Message}`,`(Get-Item -LiteralPath $env:FOREDU_UPDATE_EXECUTABLE).VersionInfo.ProductVersion`,`Get-CimInstance Win32_Process | Where-Object { $_.Name -like '*Foredu*' -or ($_.Name -like '*powershell*' -and $_.CommandLine -like '*apply.ps1*') } | Select-Object ProcessId,Name,CommandLine | ConvertTo-Json -Compress`];for(const command of commands){try{const r=await exec(ps,['-NoProfile','-Command',command],{env:{...process.env,FOREDU_DIAG_HELPER:path.join(updates,'apply.ps1'),FOREDU_UPDATE_EXECUTABLE:executable}});console.log('Diagnostic:',r.stdout.trim(),r.stderr.trim());}catch(e){console.log('Diagnostic query:',e.stdout,e.stderr)}}
          if(failed)process.exitCode=1;
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: updater-diagnostic
          path: messenger/test-results/
          retention-days: 2
