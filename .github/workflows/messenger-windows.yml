name: Diagnose Windows school outbound relay
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          repository: hwanys2/foreducator-frontend
          ref: b2e2b26e81cf7a4bdffcde1759df3ae3571c9ff2
          ssh-key: ${{ secrets.FOREDU_SOURCE_READ_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 26.5.0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: messenger-windows-prototype
          path: imported-native
          github-token: ${{ github.token }}
          run-id: 42936833696
      - name: Diagnose actual server outbound connection
        shell: bash
        env:
          FOREDU_NATIVE_BIN_DIR: ${{ github.workspace }}/imported-native/target/release
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs/promises';import os from 'node:os';import path from 'node:path';import crypto from 'node:crypto';import assert from 'node:assert/strict';import {createRequire} from 'node:module';
          const require=createRequire(process.cwd()+'/package.json');const {SchoolRuntime}=require('./messenger/electron/runtime.cjs');const {availablePort}=await import('./messenger/scripts/live-fixture.mjs');
          for(const [name,expected]of Object.entries({'foredu-server.exe':'7d81ee118a2dd99ce7afd0ff4d71caedf6c6844701522921a8b8892958ed7385','foredu-native.exe':'25a1e2139f5e330304bb0096e8378f0486a014af50e8d30ef2c32b7bb73e8609'})){assert.equal(crypto.createHash('sha256').update(await fs.readFile(path.join(process.env.FOREDU_NATIVE_BIN_DIR,name))).digest('hex'),expected);}
          const probe=await fetch('https://www.foreducator.com/api/messenger/relay',{method:'POST',headers:{'content-type':'application/json'},body:'{}'});let p;try{p=await probe.json()}catch{};console.log('Node HTTPS probe:',probe.status,/^[a-z_]{1,100}$/.test(p?.code||'')?p.code:'non_contract_response');
          const root=await fs.mkdtemp(path.join(os.tmpdir(),'foredu-relay-diagnostic-')),key=crypto.randomBytes(32);
          const admin=new SchoolRuntime({administration:true,directory:root,binaryDirectory:process.env.FOREDU_NATIVE_BIN_DIR,protect(v){const iv=crypto.randomBytes(12),c=crypto.createCipheriv('aes-256-gcm',key,iv);const b=Buffer.concat([c.update(v),c.final()]);return Buffer.concat([iv,c.getAuthTag(),b]);},unprotect(v){const c=crypto.createDecipheriv('aes-256-gcm',key,v.subarray(0,12));c.setAuthTag(v.subarray(12,28));return Buffer.concat([c.update(v.subarray(28)),c.final()]).toString();}});
          try{
          const password=crypto.randomBytes(32).toString('base64url'),connection=await admin.startServer({schoolName:'자동 검증용 Windows 중계 진단',adminPassword:password,port:await availablePort(),lan:false});await admin.login({...connection,username:'admin',password});
          console.log('diagnosticFixtureSchoolId='+(await admin.client.request('GET','/api/v1/live/bootstrap')).schoolId);
          await admin.command('school.mode',{mode:'external',cloudPolicyAccepted:true,inboundFilesAccepted:true});let previous;let connected=false;
          for(let i=0;i<30;i++){const{status}=await admin.client.request('GET','/api/v1/live/external/manage');const value=JSON.stringify({connected:status?.connected,error:status?.error});if(value!==previous){console.log('Rust school agent:',value);previous=value;}if(status?.connected){connected=true;break;}if(status?.error)break;await new Promise(r=>setTimeout(r,1000));}
          console.log('diagnosticConnected='+connected);
          }finally{await admin.command('school.mode',{mode:'local'}).catch(()=>{});await new Promise(r=>setTimeout(r,3000));await admin.logout(false).catch(()=>{});await admin.stopServer();key.fill(0);await fs.rm(root,{recursive:true,force:true});}
          NODE
